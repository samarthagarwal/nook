name: Nook
options:
  bundleIdPrefix: com.privateai
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
targets:
  Nook:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/NookApp
      - path: Sources/NookDesign
      - path: Sources/NookCore
      - path: Sources/NookRuntime
      - path: Sources/NookUI
    settings:
      base:
        PRODUCT_NAME: Nook
        PRODUCT_BUNDLE_IDENTIFIER: com.privateai.nook
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1" # iPhone only per brief
  NookTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/NookTests
    dependencies:
      - target: Nook
